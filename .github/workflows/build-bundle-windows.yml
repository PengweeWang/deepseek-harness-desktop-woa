name: Reusable Windows Offline Bundle Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      dsh_tag:
        required: true
        type: string
      bundle_git:
        description: 随包 MinGit（默认关闭：启动 dsh 不需要 Git）
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build offline bundle (windows)
    runs-on: windows-latest
    # 离线包要下载 Node/dsh 并压缩数百 MB 资源，远慢于普通构建。
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 交叉编译会同时触发宿主(x64)与目标(arm64)两份 Electron 下载；GitHub Release
      # CDN 偶发 504，预先带重试落盘可避免构建脚本里的 curl 直接失败。
      - name: Prefetch Electron runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pub const DEFAULT_VERSION: &str = "\(.*\)";$/\1/p' crates/electron-rs/src/lib.rs)"
          cache="$(cygpath -u "${LOCALAPPDATA:-$HOME/AppData/Local}")/electron/Cache"
          mkdir -p "$cache"
          for arch in win32-x64 win32-arm64; do
            file="$cache/electron-v${version}-${arch}.zip"
            [ -f "$file" ] && continue
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$file" \
                "https://github.com/electron/electron/releases/download/v${version}/electron-v${version}-${arch}.zip"; then
                break
              fi
              rm -f "$file"
              echo "electron ${arch} download failed (attempt ${attempt}/5); retrying"
              sleep 10
            done
            [ -f "$file" ] || { echo "::error::failed to prefetch electron ${arch}"; exit 1; }
          done

      - name: Cache Electron distribution
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-rs-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare bundled resources
        uses: ./.github/actions/prepare-bundle-resources
        with:
          platform: windows
          arch: arm64
          dsh-tag: ${{ inputs.dsh_tag }}
          bundle-git: ${{ inputs.bundle_git }}

      - name: Build offline application
        run: pnpm tauri build --no-bundle --target aarch64-pc-windows-msvc

      - name: Build offline installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (Test-Path S:\) { throw "S: is already in use" }
          subst S: "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "Failed to map the build workspace" }
          try {
            Set-Location S:\apps\desktop
            # NSIS cannot open long resource paths; pnpm --filter resolves the short drive back to the long path.
            node ../../node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis --target aarch64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Offline installer build failed" }
          } finally {
            Set-Location "$env:GITHUB_WORKSPACE"
            subst S: /D
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-windows
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
