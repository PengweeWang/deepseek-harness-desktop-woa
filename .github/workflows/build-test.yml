name: Build Test (unsigned)

on:
  # 仅手动触发：用于验证 Windows ARM64 产物的完整 tauri build，
  # 不发布、不打签名，也不写 GitHub Release。
  workflow_dispatch:
    inputs:
      nightly:
        description: 验证独立夜间构建身份及资产名称
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 同一分支的手动构建排队执行，避免并发挤占 runner。
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Verify Windows ARM64 toolchain
        shell: bash
        run: |
          if [ "${{ runner.arch }}" != "ARM64" ]; then
            echo "::error::windows-11-arm is ${{ runner.arch }}, expected ARM64"
            exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "aarch64-pc-windows-msvc" ]; then
            echo "::error::Rust host is $host, expected aarch64-pc-windows-msvc"
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp nightly version
        if: inputs.nightly
        shell: bash
        run: node scripts/stamp-version.mjs 0.0.0-nightly.test

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./apps/desktop/src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*\$/, '');
            fs.writeFileSync('apps/desktop/release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        run: pnpm tauri build --target aarch64-pc-windows-msvc ${{ inputs.nightly && '--config src-tauri/tauri.nightly.conf.json' || '' }} --config release-msi-version.tmp.json

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-test-windows-aarch64
          path: |
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
