name: Reusable Windows ARM64 Offline Bundle Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      dsh_tag:
        required: true
        type: string
      bundle_git:
        description: 随包 MinGit（默认关闭：启动 dsh 不需要 Git）
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build offline bundle (Windows ARM64)
    runs-on: windows-11-arm
    # 离线包要下载 Node/dsh 并压缩数百 MB 资源，远慢于普通构建。
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Windows ARM64 toolchain
        shell: bash
        run: |
          if [ "${{ runner.arch }}" != "ARM64" ]; then
            echo "::error::windows-11-arm is ${{ runner.arch }}, expected ARM64"
            exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "aarch64-pc-windows-msvc" ]; then
            echo "::error::Rust host is $host, expected aarch64-pc-windows-msvc"
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled resources
        uses: ./.github/actions/prepare-bundle-resources
        with:
          platform: windows
          arch: arm64
          dsh-tag: ${{ inputs.dsh_tag }}
          bundle-git: ${{ inputs.bundle_git }}

      - name: Build offline application
        run: pnpm tauri build --no-bundle

      - name: Build offline installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (Test-Path S:\) { throw "S: is already in use" }
          subst S: "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "Failed to map the build workspace" }
          try {
            Set-Location S:\apps\desktop
            # NSIS cannot open long resource paths; pnpm --filter resolves the short drive back to the long path.
            node ../../node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "Offline installer build failed" }
          } finally {
            Set-Location "$env:GITHUB_WORKSPACE"
            subst S: /D
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-windows-aarch64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
