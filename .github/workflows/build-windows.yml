name: Reusable Windows ARM64 Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        description: 注入的版本号；为空时沿用仓库内版本，仅夜间构建使用
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Verify Windows ARM64 toolchain
        shell: bash
        run: |
          if [ "${{ runner.arch }}" != "ARM64" ]; then
            echo "::error::windows-11-arm is ${{ runner.arch }}, expected ARM64"
            exit 1
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "aarch64-pc-windows-msvc" ]; then
            echo "::error::Rust host is $host, expected aarch64-pc-windows-msvc"
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows runner 默认 PowerShell，$STAMP_VERSION 会被当成本地变量读成空串；显式用 bash。
      - name: Stamp injected version
        if: inputs.version != ''
        shell: bash
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.mjs "$STAMP_VERSION"

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./apps/desktop/src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*$/, '');
            fs.writeFileSync('apps/desktop/release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-pc-windows-msvc ${{ inputs.version != '' && '--config src-tauri/tauri.nightly.conf.json' || '' }} --config release-msi-version.tmp.json

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-aarch64
          path: |
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
