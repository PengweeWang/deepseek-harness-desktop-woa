name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        description: 注入的版本号；为空时沿用仓库内版本，仅夜间构建使用
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # 交叉编译 WoA：runner 自带 MSVC ARM64 工具链，Rust 只需补 target。
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 交叉编译会同时触发宿主(x64)与目标(arm64)两份 Electron 下载；GitHub Release
      # CDN 偶发 504，预先带重试落盘可避免构建脚本里的 curl 直接失败。
      - name: Prefetch Electron runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pub const DEFAULT_VERSION: &str = "\(.*\)";$/\1/p' crates/electron-rs/src/lib.rs)"
          cache="$(cygpath -u "${LOCALAPPDATA:-$HOME/AppData/Local}")/electron/Cache"
          mkdir -p "$cache"
          for arch in win32-x64 win32-arm64; do
            file="$cache/electron-v${version}-${arch}.zip"
            [ -f "$file" ] && continue
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$file" \
                "https://github.com/electron/electron/releases/download/v${version}/electron-v${version}-${arch}.zip"; then
                break
              fi
              rm -f "$file"
              echo "electron ${arch} download failed (attempt ${attempt}/5); retrying"
              sleep 10
            done
            [ -f "$file" ] || { echo "::error::failed to prefetch electron ${arch}"; exit 1; }
          done

      - name: Cache Electron distribution
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-rs-${{ runner.os }}-${{ runner.arch }}

      # windows-latest 默认 PowerShell，$STAMP_VERSION 会被当成本地变量读成空串；显式用 bash。
      - name: Stamp injected version
        if: inputs.version != ''
        shell: bash
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.mjs "$STAMP_VERSION"

      # WiX/MSI 不支持 ARM64，只出 NSIS；安装器自身是 x86 在 WoA 上模拟运行。
      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles nsis ${{ inputs.version != '' && '--config src-tauri/tauri.nightly.conf.json' || '' }}

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
