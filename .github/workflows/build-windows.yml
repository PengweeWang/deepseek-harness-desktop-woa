name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        description: 注入的版本号；为空时沿用仓库内版本，仅夜间构建使用
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # 交叉编译 WoA：runner 自带 MSVC ARM64 工具链，Rust 只需补 target。
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # windows-latest 默认 PowerShell，$STAMP_VERSION 会被当成本地变量读成空串；显式用 bash。
      - name: Stamp injected version
        if: inputs.version != ''
        shell: bash
        env:
          STAMP_VERSION: ${{ inputs.version }}
        run: node scripts/stamp-version.mjs "$STAMP_VERSION"

      # WiX/MSI 不支持 ARM64，只出 NSIS；安装器自身是 x86 在 WoA 上模拟运行。
      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-pc-windows-msvc --bundles nsis ${{ inputs.version != '' && '--config src-tauri/tauri.nightly.conf.json' || '' }}

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
